# Builds the Hebrew NOOP iOS app as an unsigned .ipa for sideloading with SideStore / AltStore.
# Runs on every push to main, or manually from the Actions tab. The .ipa is attached to the
# rolling "hebrew-latest" release so SideStore/AltStore can always fetch the newest build.
name: Hebrew iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: hebrew-ios
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build NOOPiOS (unsigned, Release)
        run: >-
          xcodebuild -scheme NOOPiOS -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          CURRENT_PROJECT_VERSION=$((5000 + ${{ github.run_number }}))
          build
      - name: Package .ipa
        run: |
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo ".app not found"; exit 1; }
          rm -rf "$APP/Watch"
          # Lite variant: no widget extension, no extra entitlements — fewest things for a free
          # Apple ID signer (AltServer "Sideload .ipa", Sideloadly) to trip over.
          rm -rf lite && mkdir -p lite/Payload && cp -R "$APP" lite/Payload/
          LITE_APP=$(find lite/Payload -maxdepth 1 -name '*.app' -type d | head -1)
          rm -rf "$LITE_APP/PlugIns" "$LITE_APP/_CodeSignature"
          codesign --force --deep --sign - "$LITE_APP"
          (cd lite && zip -qry ../NOOP-hebrew-lite.ipa Payload)
          Tools/prepare-ios-sideload-app.sh "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qr NOOP-hebrew.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NOOP-hebrew-ipa
          path: NOOP-hebrew.ipa
      - name: Publish to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view hebrew-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create hebrew-latest --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "NOOP בעברית" --notes "גרסת iOS בעברית — התקנה דרך SideStore / AltStore."
          gh release upload hebrew-latest NOOP-hebrew.ipa NOOP-hebrew-lite.ipa --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish SideStore / AltStore source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          VER=$(grep -m1 'MARKETING_VERSION:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          BUILD=$((5000 + RUN))
          SIZE=$(stat -f%z NOOP-hebrew.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BASE="https://github.com/$GITHUB_REPOSITORY"
          python3 - "$VER" "$BUILD" "$SIZE" "$DATE" "$BASE" <<'PY'
          import json, sys
          ver, build, size, date, base = sys.argv[1:]
          icon = base + "/raw/main/Strand/Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512.png"
          src = {
            "name": "NOOP בעברית",
            "identifier": "com.noopapp.noop.hebrew",
            "sourceURL": base + "/releases/download/hebrew-latest/sidestore-source.json",
            "subtitle": "גרסה אישית בעברית של NOOP",
            "iconURL": icon,
            "website": base,
            "tintColor": "44E2B0",
            "apps": [{
              "name": "NOOP",
              "bundleIdentifier": "com.noopapp.noop",
              "developerName": "NoopApp (Hebrew build)",
              "subtitle": "רצועת WHOOP, אופליין, בעברית",
              "localizedDescription": "גרסה בעברית של NOOP. מבוסס על https://github.com/ryanbr/noop (PolyForm Noncommercial).",
              "iconURL": icon,
              "tintColor": "44E2B0",
              "category": "healthcare-fitness",
              "screenshotURLs": [],
              "versions": [{
                "version": ver,
                "buildVersion": build,
                "date": date,
                "localizedDescription": f"בנייה {build}",
                "downloadURL": base + "/releases/download/hebrew-latest/NOOP-hebrew.ipa",
                "size": int(size),
                "minOSVersion": "17.0"
              }]
            }],
            "news": []
          }
          json.dump(src, open("sidestore-source.json", "w"), ensure_ascii=False, indent=2)
          PY
          gh release upload hebrew-latest sidestore-source.json --repo "$GITHUB_REPOSITORY" --clobber
